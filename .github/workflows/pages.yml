# GitHub Pages 자동 배포: 이 브랜치에 푸시하면 사이트를 gh-pages 브랜치에 올립니다.
# 2026-11-19: 비밀번호 잠금을 없애고 공개 배포로 바꿨습니다(피싱 오판 대응, scripts/build-pages.mjs 머리말 참고).
# 저장소의 PAGE_PASSWORD 비밀 값은 더 이상 쓰지 않습니다.
name: GitHub Pages 배포

on:
  push:
    branches: [claude/busy-wright-7wa9ee]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 설치
        run: npm ci

      - name: 사이트 만들기
        run: npm run build:pages

      - name: gh-pages 브랜치에 올리기
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist-pages
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
